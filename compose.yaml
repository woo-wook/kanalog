name: kanalog
services:
  backend:
    build:
      context: ./backend
    environment:
      RDB_HOST: ${RDB_HOST:-jdbc:postgresql://infra-postgres:5432/kanalog}
      RDB_USER: kanalog
      RDB_PASSWORD: ${RDB_PASSWORD:?Set RDB_PASSWORD in .env}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://kanalog.hanwook.me}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      MEDIA_ROOT: /app/media
    volumes:
      - kanalog_media:/app/media
      - ./private-data/converted:/app/import:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/health/ready"]
      interval: 10s
      timeout: 3s
      start_period: 45s
      retries: 10
    restart: unless-stopped
    networks:
      - default
      - dutchlog_infra

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_API_URL: http://backend:8080
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${APP_PORT:-3200}:3000"
    volumes:
      - ./private-data/supertonic/models:/app/public/tts/supertonic:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kanalog_media:

networks:
  dutchlog_infra:
    external: true
    name: infra-backend
