name: kanalog
services:
  db:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: kanalog
      POSTGRES_USER: kanalog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - kanalog_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanalog -d kanalog"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      RDB_HOST: jdbc:postgresql://db:5432/kanalog
      RDB_USER: kanalog
      RDB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3200}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MEDIA_ROOT: /app/media
    volumes:
      - kanalog_media:/app/media
      - ./private-data/converted:/app/import:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/health/ready"]
      interval: 10s
      timeout: 3s
      start_period: 45s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_API_URL: http://backend:8080
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${APP_PORT:-3200}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kanalog_postgres:
  kanalog_media:
