name: kanalog
services:
  backend:
    build:
      context: ./backend
    environment:
      RDB_HOST: ${RDB_HOST:-jdbc:postgresql://infra-postgres:5432/kanalog}
      RDB_USER: kanalog
      RDB_PASSWORD: ${RDB_PASSWORD:?Set RDB_PASSWORD in .env}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://kanalog.hanwook.me}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      MEDIA_ROOT: /app/media
      SPEECH_URL: http://voice:8090
    depends_on:
      voice:
        condition: service_healthy
    volumes:
      - kanalog_media:/app/media
      - ./private-data/converted:/app/import:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/health/ready"]
      interval: 10s
      timeout: 3s
      start_period: 45s
      retries: 10
    restart: unless-stopped
    networks:
      - default
      - dutchlog_infra

  voice:
    build:
      context: .
      dockerfile: tools/voice-server/Dockerfile
    volumes:
      - ./private-data/supertonic/models:/app/models:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 10
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_API_URL: http://backend:8080
      APP_DOWNLOAD_ROOT: /app/downloads
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${APP_PORT:-3200}:3000"
    volumes:
      - ./public-downloads:/app/downloads:ro
      - ./private-data/supertonic/models:/app/public/tts/supertonic:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kanalog_media:

networks:
  dutchlog_infra:
    external: true
    name: infra-backend
