name: Native apps
on:
  push:
    branches: [main]
    paths: ["native/**", "tools/native-content/**", ".github/workflows/native.yml"]
  pull_request:
    paths: ["native/**", "tools/native-content/**", ".github/workflows/native.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Core, lint, APK and instrumentation source
        working-directory: native/android
        run: ./gradlew :core:test ktlintCheck :app:assembleDebug :app:assembleDebugAndroidTest --console=plain
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-kana-debug
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Xcode SDK
        run: |
          xcodebuild -version
          echo "::notice title=Xcode SDK::$(xcodebuild -version | tr '\n' ' ')"
      - name: Swift core
        working-directory: native/ios
        run: swift test
      - name: Build iOS simulator app
        working-directory: native/ios
        run: |
          set -o pipefail
          if ! xcodebuild -project Kanalog.xcodeproj -scheme Kanalog -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build > ios-build.log 2>&1; then
            tail -120 ios-build.log
            python3 - <<'PY'
          from pathlib import Path
          for line in Path('ios-build.log').read_text().splitlines():
              if 'error:' in line:
                  print('::error title=iOS build::' + line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
            exit 1
          fi
          tail -12 ios-build.log
      - name: iOS UI flow and persistence
        working-directory: native/ios
        run: |
          xcrun simctl list devices available --json > simulators.json
          DEVICE_ID=$(python3 - <<'PY'
          import json
          data = json.load(open('simulators.json'))['devices']
          for runtime in sorted(data, reverse=True):
              phones = [d for d in data[runtime] if 'iOS' in runtime and d['name'].startswith('iPhone') and d['isAvailable']]
              if phones:
                  print(phones[0]['udid'])
                  break
          PY
          )
          test -n "$DEVICE_ID"
          if ! xcodebuild -project Kanalog.xcodeproj -scheme Kanalog -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath DerivedData -parallel-testing-enabled NO -test-timeouts-enabled YES -maximum-test-execution-time-allowance 180 CODE_SIGNING_ALLOWED=NO test > ios-ui.log 2>&1; then
            tail -100 ios-ui.log
            python3 - <<'PY'
          from pathlib import Path
          for line in Path('ios-ui.log').read_text().splitlines():
              if 'KANALOG_UI' in line:
                  print('::notice title=iOS test stage::' + line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
              if 'error:' in line or 'failed' in line.lower():
                  print('::error title=iOS UI::' + line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
            exit 1
          fi
          tail -15 ios-ui.log
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ios-kana-simulator
          path: native/ios/DerivedData/Build/Products/Debug-iphonesimulator/Kanalog.app
