name: Kanalog
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  KanalogCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
targets:
  Kanalog:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: ../shared/builtin-content.json
        buildPhase: resources
      - path: Resources/PersonalAssets
        type: folder
        buildPhase: resources
    dependencies:
      - package: KanalogCore
        product: KanalogCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.hanwook.kanalog
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_CFBundleDisplayName: Kanalog
    scheme:
      testTargets:
        - KanalogUITests
  KanalogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Kanalog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.hanwook.kanalog.uitests
        GENERATE_INFOPLIST_FILE: YES
